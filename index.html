<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Dom실습</title>
    <style>
        #image {
            border: 1px dashed #ccc;
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <h1 id='title'>제목</h1>
    <button id="changeButton">제목 변경</button>
    <button id="changestyle">스타일 변경</button>

    <h1>이미지 속성 변경</h1>
    <img id="image" alt="이미지가 여기에 표시됨">
    <br><br>
    <button id="imageButton">이미지 보이기</button>

    <script>
        const titleElement = document.getElementById('title');
        const btn1 = document.getElementById('changeButton');
        const btn2 = document.getElementById('changestyle')
        const myimage = document.getElementById('image');
        const mybutton = document.getElementById('imageButton');

        btn1.addEventListener('click', function () {
            titleElement.textContent = "Javascript로 제목을 바꿨습니다.";
        });
        btn2.addEventListener('click', function () {
            titleElement.style.color = "white";
            titleElement.style.backgroundColor = "blue";
            titleElement.style.padding = "10px";
        });
        mybutton.addEventListener('click', function () {
            myimage.src = "https://placehold.co/300x200";
            myimage.width = 300;
            myimage.height = 200;
        });
    </script>
</body>

</html>
